<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie | Top G Sport</title>
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>
<body>
    <header>
        <nav class="main-nav">
            <div class="logo">Top G Sport</div>
            <input type="checkbox" id="nav-toggle" class="nav-toggle">
            <label for="nav-toggle" class="nav-toggle-label">
                <span></span>
            </label>
            <ul>
                <li><a href="index.html" data-i18n="home"><i class="fas fa-home"></i> Główna</a></li>
                <li><a href="about.html" data-i18n="about"><i class="fas fa-users"></i> O nas</a></li>
                <li><a href="shop.html" data-i18n="shop"><i class="fas fa-users"></i> Sklep</a></li>
                <li><a href="offer.html" data-i18n="offer"><i class="fas fa-dumbbell"></i> Oferta</a></li>
                <li><a href="contact.html" data-i18n="contact"><i class="fas fa-envelope"></i> Kontakt</a></li>
                <li><a href="login.html" class="active" data-i18n="login"><i class="fas fa-sign-in-alt"></i> Zaloguj</a></li>
                <li><a href="profile.html" data-i18n="profile"><i class="fas fa-user"></i> Profil</a></li>
            </ul>
            <div class="lang-switcher">
                <span style="font-size:1.2em;margin-right:6px;">🌐</span>
                <select id="lang-switcher">
                    <option value="pl">PL</option>
                    <option value="en">EN</option>
                </select>
            </div>
        </nav>
    </header>
    <div class="login-container">
        <div class="logo">Top G Sport</div>
        <div id="login-form">
            <h2 data-i18n="login_title">Zaloguj się</h2>
            <div class="form-group">
                <input type="email" id="login-email" data-i18n-placeholder="form_email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="password" id="login-password" data-i18n-placeholder="form_password" placeholder="Hasło" required>
            </div>
            <button id="login-btn" class="btn-primary" data-i18n="login_btn">Zaloguj się</button>
            <p class="switch-form">
                <span data-i18n="no_account">Nie masz konta?</span>
                <a href="#" id="show-register" data-i18n="register_link">Zarejestruj się</a>
            </p>
            <div class="msg" id="login-msg"></div>
        </div>
        <div id="register-form" style="display:none;">
            <h2 data-i18n="register_title">Rejestracja</h2>
            <div class="form-group">
                <input type="text" id="reg-name" data-i18n-placeholder="form_name" placeholder="Imię i nazwisko" required>
            </div>
            <div class="form-group">
                <input type="email" id="reg-email" data-i18n-placeholder="form_email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="tel" id="reg-phone" data-i18n-placeholder="form_phone" placeholder="Telefon" required>
            </div>
            <div class="form-group">
                <input type="password" id="reg-password" data-i18n-placeholder="form_password" placeholder="Hasło" required>
            </div>
            <button id="register-btn" class="btn-primary" data-i18n="register_btn">Zarejestruj się</button>
            <p class="switch-form">
                <span data-i18n="have_account">Masz już konto?</span>
                <a href="#" id="show-login" data-i18n="login_link">Zaloguj się</a>
            </p>
            <div class="msg" id="register-msg"></div>
        </div>
    </div>
    <div id="success-message" class="success-message" style="display:none;" data-i18n="login_success">
        Zalogowano pomyślnie!
    </div>
    <script src="/js/login.js"></script>
</body>
</html>
