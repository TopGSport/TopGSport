<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title data-i18n="title">Продукт | Top G Sport</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav class="main-nav">
            <div class="logo">Top G Sport</div>
            <input type="checkbox" id="nav-toggle" class="nav-toggle">
            <label for="nav-toggle" class="nav-toggle-label">
                <span></span>
            </label>
            <ul>
                <li><a href="index.html" data-i18n="home"><i class="fas fa-home"></i> Główna</a></li>
                <li><a href="about.html" data-i18n="about"><i class="fas fa-users"></i> O nas</a></li>
                <li><a href="shop.html" data-i18n="shop"><i class="fas fa-users"></i> Shop</a></li>
                <li><a href="offer.html" data-i18n="offer"><i class="fas fa-dumbbell"></i> Oferta</a></li>
                <li><a href="contact.html" data-i18n="contact"><i class="fas fa-envelope"></i> Kontakt</a></li>
                <li><a href="login.html" data-i18n="login"><i class="fas fa-sign-in-alt"></i> Zaloguj</a></li>
                <li><a href="profile.html" data-i18n="profile"><i class="fas fa-user"></i> Profil</a></li>
            </ul>
            <div class="lang-switcher">
                <span style="font-size:1.2em;margin-right:6px;">🌐</span>
                <select id="lang-switcher">
                    <option value="pl">PL</option>
                    <option value="en">EN</option>
                </select>
            </div>
            <div class="cart-icon" id="cart-icon">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count">0</span>
            </div>
        </nav>
    </header>
    <div id="side-cart">
        <div id="side-cart-header">
            <span data-i18n="cart_title">Twój koszyk</span>
            <span id="side-cart-close">&times;</span>
        </div>
        <div id="side-cart-list"></div>
        <div id="side-cart-footer">
            <div id="side-cart-total" data-i18n="cart_total">Suma: $0</div>
            <button id="side-cart-checkout" data-i18n="cart_checkout">Oformić zamówienie</button>
        </div>
    </div>
    <main>
        <div id="product-container">
        </div>
    </main>

    <script src="js/cart.js"></script>
    <script src="js/product.js"></script>
</body>
</html>
