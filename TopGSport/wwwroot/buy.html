<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kup Karnet | Top G Sport</title>
    <link rel="stylesheet" href="/css/buy.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav class="main-nav">
            <div class="logo">Top G Sport</div>
            <input type="checkbox" id="nav-toggle" class="nav-toggle">
            <label for="nav-toggle" class="nav-toggle-label">
                <span></span>
            </label>
            <ul>
                <li><a href="index.html" data-i18n="home"><i class="fas fa-home"></i> Główna</a></li>
                <li><a href="about.html" data-i18n="about"><i class="fas fa-users"></i> O nas</a></li>
                <li><a href="shop.html" data-i18n="shop"><i class="fas fa-users"></i> Shop</a></li>
                <li><a href="offer.html" class="active" data-i18n="offer"><i class="fas fa-dumbbell"></i> Oferta</a></li>
                <li><a href="contact.html" data-i18n="contact"><i class="fas fa-envelope"></i> Kontakt</a></li>
                <li><a href="login.html" data-i18n="login"><i class="fas fa-sign-in-alt"></i> Zaloguj</a></li>
                <li><a href="profile.html" data-i18n="profile"><i class="fas fa-user"></i> Profil</a></li>
            </ul>
            <div class="lang-switcher">
                <span style="font-size:1.2em;margin-right:6px;">🌐</span>
                <select id="lang-switcher">
                    <option value="pl">PL</option>
                    <option value="en">EN</option>
                </select>
            </div>
        </nav>
    </header>
    <div class="buy-container">
        <h1 data-i18n="buy_title">Kup Karnet</h1>
        <div id="karnet-info"></div>
        <form id="buy-form">
            <label data-i18n="start_label">
                Data startu:
                <input type="date" id="start-date" required>
            </label>
            <div class="options">
                <label><input type="checkbox" id="opt-trener"> <span data-i18n="opt_trener">Osobisty trener</span></label>
                <label><input type="checkbox" id="opt-towel"> <span data-i18n="opt_towel">Ręcznik</span></label>
                <label><input type="checkbox" id="opt-locker"> <span data-i18n="opt_locker">Szafka</span></label>
            </div>
            <h3 data-i18n="contact_data">Dane kontaktowe</h3>
            <input type="text" id="user-name" data-i18n-ph="ph_name" placeholder="Imię i nazwisko" required>
            <input type="email" id="user-email" data-i18n-ph="ph_email" placeholder="Email" required>
            <input type="tel" id="user-phone" data-i18n-ph="ph_phone" placeholder="Telefon" required>
            <button type="submit" id="buy-btn" data-i18n="buy_btn">Kup teraz</button>
            <div class="msg" id="buy-msg"></div>
        </form>
    </div>
    <script src="/js/buy.js"></script>
</body>
</html>
