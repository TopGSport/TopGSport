<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sklep | Top G Sport</title>
    <link rel="stylesheet" href="/css/shop.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav class="main-nav">
            <div class="logo">Top G Sport</div>
            <label for="nav-toggle" class="nav-toggle-label">
                <span></span>
            </label>
            <ul>
                <li><a href="index.html" data-i18n="home"><i class="fas fa-home"></i> Główna</a></li>
                <li><a href="about.html" data-i18n="about"><i class="fas fa-users"></i> O nas</a></li>
                <li><a href="shop.html" class="active" data-i18n="shop"><i class="fas fa-users"></i> Sklep</a></li>
                <li><a href="offer.html" data-i18n="offer"><i class="fas fa-dumbbell"></i> Oferta</a></li>
                <li><a href="contact.html" data-i18n="contact"><i class="fas fa-envelope"></i> Kontakt</a></li>
                <li><a href="login.html" data-i18n="login"><i class="fas fa-sign-in-alt"></i> Zaloguj</a></li>
                <li><a href="profile.html" data-i18n="profile"><i class="fas fa-user"></i> Profil</a></li>
            </ul>
            <div class="lang-switcher">
                <span style="font-size:1.2em;margin-right:6px;">🌐</span>
                <select id="lang-switcher">
                    <option value="pl">PL</option>
                    <option value="en">EN</option>
                </select>
            </div>
        </nav>
    </header>
    <main>
        <section class="shop-search">
            <input type="text" id="shop-search-input" data-i18n-placeholder="search_placeholder" placeholder="Szukaj produktu...">
        </section>

        <section class="shop-section">
            <h2 data-i18n="clothes_title">Odzież</h2>
            <div class="shop-filters">
                <label>
                    <span data-i18n="type_label">Typ:</span>
                    <select id="clothes-filter">
                        <option value="all" data-i18n="all_option">Wszystko</option>
                        <option value="tshirt" data-i18n="tshirt_option">T-shirt</option>
                        <option value="shorts" data-i18n="shorts_option">Szorty</option>
                        <option value="hoodie" data-i18n="hoodie_option">Bluza</option>
                    </select>
                </label>
            </div>
            <div id="clothes-list" class="shop-list"></div>
        </section>

        <section class="shop-section">
            <h2 data-i18n="supplements_title">Suplementy</h2>
            <div class="shop-filters">
                <label>
                    <span data-i18n="type_label">Typ:</span>
                    <select id="supp-filter">
                        <option value="all" data-i18n="all_option">Wszystko</option>
                        <option value="creatine" data-i18n="creatine_option">Kreatyna</option>
                        <option value="protein" data-i18n="protein_option">Białko</option>
                        <option value="bcaa" data-i18n="bcaa_option">BCAA</option>
                    </select>
                </label>
            </div>
            <div id="supplements-list" class="shop-list"></div>
        </section>
    </main>
    <footer>
        <div class="footer-content">
            <span data-i18n="footer_copyright">Top G Sport &copy; 2025</span>
        </div>
    </footer>
    <script src="/js/shop.js"></script>
</body>
</html>
